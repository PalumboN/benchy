# this run definition will be chosen if no parameters are given to rebench
runs:
  invocations: 30

default_experiment: Blocks
default_data_file: 'gcTime_Blocks.data'

# a set of suites with different benchmarks and possibly different settings
benchmark_suites:
    StartUp:
        gauge_adapter: PlainSecondsLog
        command: eval "%(benchmark)s. Smalltalk vm totalGCTime"
        benchmarks:
            - "1+1"
    Compile:
        gauge_adapter: PlainSecondsLog
        command: eval "OpalCompiler %(benchmark)s. Smalltalk vm totalGCTime"
        benchmarks:
            - "recompileAll"
    Tests:
        gauge_adapter: PlainSecondsLog
        command: profile --totalGC-time "%(benchmark)s"
        benchmarks:
            - "Opal.*|AST.*"
            - "Kernel.*"
            - "File.*"
            - "Microdown.*"
            - "Network.*|Zinc.*|Zodiac.*"
    Smark-Richards:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 20;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - "SMarkRichards"
    Smark-DeltaBlue:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 20000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - "SMarkDeltaBlue"
    Smark-Slopstone:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 100000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - "SMarkSlopstone"
    BenchmarkGameSuite-VeryShort:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 300000.
    
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.
    
            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 300000;
                iterations: 10.
    
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - benchFasta
            - benchChameleons
            - benchReverseComplement
            - benchThreadRing
            - benchNBody
    BenchmarkGameSuite-Short:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 30000.
            
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.
            
            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 30000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - benchKNucleotide
            - benchChameneosRedux
            - benchRegexDNA
    BenchmarkGameSuite-Mid:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 1500.

            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 1500;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - benchPiDigits
    BenchmarkGameSuite-Long:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 1000.

            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 1000;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - benchSpectralNorm
            - benchMeteor
            - benchMandelbrot
    BenchmarkGameSuite-VeryLong:
        gauge_adapter: PlainSecondsLog
        command: |-
            eval " |benchmark runner|
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 15;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            Smalltalk vm totalGCTime"
        benchmarks:
            - benchBinaryTrees
#            - benchFannkuchRedux

