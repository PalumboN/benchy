# this run definition will be chosen if no parameters are given to rebench
runs:
  invocations: 10
  max_invocation_time: 600

default_experiment: Accessors
default_data_file: 'executionTime_Accessors.data'

# a set of suites with different benchmarks and possibly different settings
benchmark_suites:
    StartUp:
        gauge_adapter: Time
        command: eval "%(benchmark)s"
        benchmarks:
            - "1+1"
    Compile:
        gauge_adapter: Time
        command: eval "OpalCompiler %(benchmark)s."
        benchmarks:
            - "recompileAll"
    Tests:
        gauge_adapter: Time
        command: test --junit-xml-output "%(benchmark)s"
        benchmarks:
            - "Opal.*|AST.*"
            - "Kernel.*"
            - "File.*"
            - "Microdown.*"
            - "Network.*|Zinc.*|Zodiac.*"
    Smark-Richards:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 20;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - "SMarkRichards"
    Smark-DeltaBlue:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 20000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - "SMarkDeltaBlue"
    Smark-Slopstone:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            benchmark := %(benchmark)s new.
            runner := benchmark class defaultRunner new.
            runner
                problemSize: 100000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - "SMarkSlopstone"
    BenchmarkGameSuite-VeryShort:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 300000.
    
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.
    
            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 300000;
                iterations: 10.
    
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - benchFasta
            - benchChameleons
            - benchReverseComplement
            - benchThreadRing
            - benchNBody
    BenchmarkGameSuite-Short:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 30000.
            
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.
            
            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 30000;
                iterations: 10.
            
            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - benchKNucleotide
            - benchChameneosRedux
            - benchRegexDNA
    BenchmarkGameSuite-Mid:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 1500.

            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 1500;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - benchPiDigits
    BenchmarkGameSuite-Long:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            BGFastaCache primeForFasta: 1000.

            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 1000;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - benchSpectralNorm
            - benchMeteor
            - benchMandelbrot
    BenchmarkGameSuite-VeryLong:
        gauge_adapter: ReBenchLog
        command: |-
            eval " |benchmark runner|
            benchmark := BenchmarkGameSuite new.
            runner := benchmark class defaultRunner new.

            benchmark runOnly: #%(benchmark)s.
            runner
                problemSize: 15;
                iterations: 10.

            benchmark runner: runner.
            runner suite: benchmark.
            runner execute.
            runner"
        benchmarks:
            - benchBinaryTrees
#            - benchFannkuchRedux

